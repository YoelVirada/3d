name: SpatialCaptureRunner
options:
  bundleIdPrefix: com.yoel
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  SpatialCaptureRunner:
    type: application
    platform: iOS
    sources:
      - path: SpatialCapture
        createIntermediateGroups: true
    info:
      path: SpatialCapture/Info.plist
      properties:
        CFBundleDisplayName: Spatial Capture
        UILaunchScreen: {}
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
        PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}
        INFOPLIST_FILE: SpatialCapture/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    frameworks:
      - sdk: ARKit.framework
      - sdk: AVFoundation.framework
      - sdk: PhotosUI.framework
      - sdk: CoreImage.framework
