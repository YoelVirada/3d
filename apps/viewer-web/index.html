<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Asset Viewer</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #0d0d12; color: #e8e8ef; overflow: hidden; }
      #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
      aside { background: #14141c; border-right: 1px solid #2a2a38; overflow-y: auto; padding: 12px; }
      main { position: relative; }
      #canvas-container { width: 100%; height: 100%; }
      h1 { font-size: 14px; margin-bottom: 8px; color: #9af; }
      h2 { font-size: 12px; margin: 12px 0 6px; color: #888; text-transform: uppercase; }
      .stat { font-size: 11px; margin: 4px 0; color: #aaa; }
      .warn { color: #fa6; }
      .obj-item { padding: 8px; margin: 4px 0; background: #1c1c28; border-radius: 6px; cursor: pointer; font-size: 12px; }
      .obj-item.selected { outline: 1px solid #6af; }
      button { margin-top: 8px; padding: 8px 12px; background: #2a4a8a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
      button:hover { background: #3a5a9a; }
      #error { color: #f66; padding: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <main><div id="canvas-container"></div></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
