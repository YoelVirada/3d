[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-asset-compiler"
version = "0.1.0"
description = "Capture-first pipeline: phone video to object-aware spatial asset packages"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24,<2",
    "opencv-python-headless==4.10.0.84",
    "plyfile>=1.0",
    "open3d>=0.18",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
spatial-capture-server = "spatial_asset_compiler.capture_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spatial_asset_compiler*"]

[tool.setuptools.package-data]
spatial_asset_compiler = ["py.typed"]
